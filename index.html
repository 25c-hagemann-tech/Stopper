<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><!-- STOPPER -->
    <div class="box">
        <h2>Stopper</h2>
        <div class="display" id="stopwatch-display">00:00.0</div>
        <button onclick="startStopwatch()">Indítás</button>
        <button onclick="pauseStopwatch()">Szünet</button>
        <button onclick="resetStopwatch()">Nullázás</button>
    </div>

    <!-- VISSZASZÁMLÁLÓ -->
    <div class="box">
        <h2>Visszaszámláló</h2>
        <div>
            <input type="number" id="timer-input" value="10" min="1"> másodperc
        </div>
        <div class="display" id="timer-display">00:10</div>
        <button onclick="startTimer()">Indítás</button>
        <button onclick="pauseTimer()">Szünet</button>
        <button onclick="resetTimer()">Nullázás</button>
    </div>

    <script>
        // Stopper logika
        let stopwatchInterval;
        let stopwatchTime = 0;

        function startStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchInterval = setInterval(() => {
                stopwatchTime++;
                let minutes = Math.floor(stopwatchTime / 600);
                let seconds = Math.floor((stopwatchTime % 600) / 10);
                let tenths = stopwatchTime % 10;
                
                document.getElementById('stopwatch-display').innerText = 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(seconds).padStart(2, '0') + '.' + tenths;
            }, 100);
        }

        function pauseStopwatch() {
            clearInterval(stopwatchInterval);
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            document.getElementById('stopwatch-display').innerText = "00:00.0";
        }

        // Visszaszámláló logika
        let timerInterval;
        let timerTime = 10;

        function updateTimerDisplay() {
            let minutes = Math.floor(timerTime / 60);
            let seconds = timerTime % 60;
            document.getElementById('timer-display').innerText = 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerTime > 0) {
                    timerTime--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert("Lejárt az idő!");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            let inputSec = parseInt(document.getElementById('timer-input').value) || 0;
            timerTime = inputSec;
            updateTimerDisplay();
        }
    </script>

    
</body>
</html>
